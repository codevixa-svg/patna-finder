# Khojya Frontend - Nginx Configuration
# File: /etc/nginx/sites-available/patnafinder.codevixa.com
# Enable: sudo ln -s /etc/nginx/sites-available/patnafinder.codevixa.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name patnafinder.codevixa.com www.patnafinder.codevixa.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://patnafinder.codevixa.com$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.patnafinder.codevixa.com;

    ssl_certificate /etc/letsencrypt/live/patnafinder.codevixa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patnafinder.codevixa.com/privkey.pem;

    return 301 https://patnafinder.codevixa.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name patnafinder.codevixa.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/patnafinder.codevixa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patnafinder.codevixa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/khojya-frontend-access.log;
    error_log /var/log/nginx/khojya-frontend-error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}
