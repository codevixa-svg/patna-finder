# Nginx reverse proxy — serves Next.js frontend + Laravel API
# on the same domain: https://patna-finder.codevixa.com
#
# Layout assumed on the server:
#   /var/www/patna-finder/frontend  -> Next.js (port 3000 via pm2)
#   /var/www/patna-finder/backend   -> Laravel API (php-fpm / artisan serve)
#
# 1. Copy to /etc/nginx/sites-available/patna-finder
# 2. ln -s /etc/nginx/sites-available/patna-finder /etc/nginx/sites-enabled/
# 3. certbot --nginx -d patna-finder.codevixa.com   # SSL
# 4. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name patna-finder.codevixa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name patna-finder.codevixa.com;

    # certbot will manage these lines
    ssl_certificate     /etc/letsencrypt/live/patna-finder.codevixa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patna-finder.codevixa.com/privkey.pem;

    client_max_body_size 20M;

    # ---------- Laravel API (/api, /storage) ----------
    location ~ ^/(api|storage)/ {
        root /var/www/patna-finder/backend/laravel/public;

        # Serve uploaded files directly
        location /storage/ {
            alias /var/www/patna-finder/backend/laravel/storage/app/public/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        }
    }

    # ---------- Next.js frontend (everything else) ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
