# Khojya Backend API - Nginx Configuration
# File: /etc/nginx/sites-available/patnafinderapi.codevixa.com
# Enable: sudo ln -s /etc/nginx/sites-available/patnafinderapi.codevixa.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name patnafinderapi.codevixa.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name patnafinderapi.codevixa.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/patnafinderapi.codevixa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patnafinderapi.codevixa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/patna-finder-api/public;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/khojya-api-access.log;
    error_log /var/log/nginx/khojya-api-error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File Upload Size
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|gitignore|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
